name: Validate and deploy personal website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: personal-website-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Preview is the safe default until domain migration is approved.
      PUBLIC_SITE_MODE: ${{ vars.PERSONAL_SITE_MODE == 'production' && 'production' || 'preview' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check root-relative URLs and expected routes
        run: node scripts/audit-source.mjs
      - name: Verify light/dark theme behavior
        run: node scripts/check-theme-switch.mjs
      - name: Verify Academic Minimal templates and portrait
        run: node scripts/check-page-templates.mjs
      - name: Verify public CV integration and privacy policy
        run: node scripts/check-public-cv.mjs
      - name: Verify IEEE-style bibliography formatting and metadata completeness
        run: node --experimental-strip-types scripts/check-ieee-bibliography.mjs
      - name: Validate researcher design comparison lab
        run: node scripts/check-researcher-design-lab.mjs
      # Generate the public PDF from the same curated data and publications
      # that power the website BEFORE the Pages artifact is uploaded.
      - name: Set up Node 24 for CV source export
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate and audit updated public CV PDF
        run: |
          python3 -m pip install --disable-pip-version-check reportlab==4.4.9 PyYAML==6.0.3 pypdf==5.9.0
          node --experimental-strip-types scripts/export-public-cv-data.mjs /tmp/personal-public-cv.json
          python3 scripts/generate-public-cv-pdf.py /tmp/personal-public-cv.json public/files/arif-muamar-cv.pdf
          python3 scripts/check-generated-public-cv.py public/files/arif-muamar-cv.pdf

      - name: Build Astro site and upload artifact
        uses: withastro/action@v6
        with:
          node-version: 24
      - name: Validate generated links and assets
        run: npm run test:links
      - name: Audit generated HTML, SEO and migration routes
        run: npm run test:quality
      - name: Enforce safe crawl policy in preview
        run: |
          if [ "$PUBLIC_SITE_MODE" != 'production' ]; then
            grep -q 'noindex, nofollow' dist/index.html
            grep -q 'Disallow: /personal-website/' dist/robots.txt
          fi

      - name: Dry-run production-domain build (never deploy this output)
        env:
          PUBLIC_SITE_MODE: production
        run: |
          npm run build
          npm run test:links
          npm run test:quality
          grep -q 'content="index, follow"' dist/index.html

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
