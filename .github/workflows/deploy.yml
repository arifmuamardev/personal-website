name: Validate and deploy personal website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: personal-website-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Domain launch approved on 2026-10-15. Only deployments from main
      # are public, indexable, and built for https://arifmuamar.com/.
      # Pull-request builds remain staging/noindex, with a prod dry-run gate.
      PUBLIC_SITE_MODE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check root-relative URLs and expected routes
        run: node scripts/audit-source.mjs
      - name: Verify light/dark theme behavior
        run: node scripts/check-theme-switch.mjs
      - name: Verify Academic Minimal templates and portrait
        run: node scripts/check-page-templates.mjs
      - name: Verify public CV integration and privacy policy
        run: node scripts/check-public-cv.mjs
      - name: Verify IEEE-style bibliography formatting and metadata completeness
        run: node --experimental-strip-types scripts/check-ieee-bibliography.mjs
      - name: Check complete publication collection provenance and date exceptions
        run: npm run audit:publications
      - name: Validate researcher design comparison lab
        run: node scripts/check-researcher-design-lab.mjs
      # Combined CV and public PDF are paused; no PDF should be generated.
      - name: Build Astro site and upload artifact
        uses: withastro/action@v6
        with:
          node-version: 24
      - name: Validate generated links and assets
        run: npm run test:links
      - name: Audit generated HTML, SEO and migration routes
        run: npm run test:quality
      - name: Enforce crawl policy for this deployment
        run: |
          if [ "$PUBLIC_SITE_MODE" = 'production' ]; then
            grep -q 'content="index, follow"' dist/index.html
            grep -q 'https://arifmuamar.com' dist/sitemap-index.xml
            grep -q 'Sitemap:' dist/robots.txt
          else
            grep -q 'noindex, nofollow' dist/index.html
            grep -q 'Disallow: /personal-website/' dist/robots.txt
          fi

      - name: Dry-run production-domain build (never deploy this output)
        env:
          PUBLIC_SITE_MODE: production
        run: |
          npm run build
          npm run test:links
          npm run test:quality
          grep -q 'content="index, follow"' dist/index.html

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
